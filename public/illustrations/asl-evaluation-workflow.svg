<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Building an ASL video translator</title><desc id="desc">Engineering evaluation: freeze the input, inspect the timeline, review the meaning, record the limits.</desc>
<rect width="1200" height="630" fill="#eef2ff"/><rect x="54" y="54" width="1092" height="522" rx="28" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#172554"><text x="94" y="115" font-size="22" letter-spacing="3">CURIFY ENGINEERING</text><text x="94" y="190" font-size="48" font-weight="700">Building an ASL video translator</text><text x="94" y="237" font-size="25" fill="#475569">Experiments, failures and evaluation</text>
<g font-size="24"><rect x="94" y="295" width="485" height="91" rx="16" fill="#eef2ff"/><text x="120" y="350">1. Freeze input and configuration</text><rect x="601" y="295" width="485" height="91" rx="16" fill="#eef2ff"/><text x="627" y="350">2. Inspect the frame timeline</text><rect x="94" y="405" width="485" height="91" rx="16" fill="#eef2ff"/><text x="120" y="460">3. Review meaning, not fluency</text><rect x="601" y="405" width="485" height="91" rx="16" fill="#eef2ff"/><text x="627" y="460">4. Record what remains unproven</text></g>
<text x="94" y="545" font-size="19" fill="#64748b">Research evidence and production behavior are separate.</text></g></svg>
